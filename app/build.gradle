plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.screenai.assistant'
    compileSdk 35
    defaultConfig {
        applicationId 'com.screenai.assistant'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '21.0-alpha'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
