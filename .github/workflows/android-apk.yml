name: Build Potato AI V21

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build library AAR and demo APK
        working-directory: PotatoAI_V21_Alpha
        run: gradle --no-daemon :potatoai:assembleRelease :demo:assembleDebug
      - name: Upload Potato AI V21 outputs
        uses: actions/upload-artifact@v4
        with:
          name: PotatoAI-V21-Alpha
          path: |
            PotatoAI_V21_Alpha/demo/build/outputs/apk/debug/*.apk
            PotatoAI_V21_Alpha/potatoai/build/outputs/aar/*.aar
          if-no-files-found: error
          retention-days: 30
