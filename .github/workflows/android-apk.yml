name: Build ScreenAI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Commit APK to dist branch
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ScreenAI-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B dist-apk
          git add -f dist/ScreenAI-debug.apk
          git commit -m "Build APK ${{ github.sha }}" --allow-empty
          git push --force origin dist-apk
